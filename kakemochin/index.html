<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KakeMochin</title>
<meta name="description" content="Shift and money planner for students juggling part-time jobs. Data stays in your browser.">
<meta name="theme-color" content="#54a69e">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --accent:#54a69e; --accent-soft:rgba(84,166,158,.18); --accent-bar:rgba(84,166,158,.35);
  --bg:#f2f2f7; --card:#ffffff; --text:#1c1c1e; --muted:#6c6c70; --line:#e5e5ea; --fill:#e9e9ee; --danger:#d93a32;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000; --card:#1c1c1e; --text:#f2f2f7; --muted:#a1a1a6; --line:#38383a; --fill:#2c2c2e; --danger:#ff6961; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}
button,input,select{font:inherit;color:inherit}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(84px + env(safe-area-inset-bottom))}
h1{font-size:30px;margin:8px 0 16px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:16px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.hdr h2{font-size:14px;font-weight:600;color:var(--muted);margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.big{font-size:32px;font-weight:700} .mid{font-size:24px;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.bar{position:relative;height:12px;border-radius:6px;background:var(--fill);overflow:hidden;margin:10px 0}
.bar span{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.pill{font-size:11px;font-weight:600;padding:2px 6px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.btn{border:0;border-radius:99px;padding:6px 12px;background:var(--accent-soft);color:var(--accent);font-weight:600;cursor:pointer}
.btn.solid{background:var(--accent);color:#fff}
.btn.danger{background:transparent;color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}
.icon-btn{border:0;background:none;color:var(--accent);font-size:22px;padding:6px 10px;cursor:pointer;min-width:44px;min-height:44px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.list-item:first-of-type{border-top:0}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;min-width:32px;min-height:32px}
/* calendar */
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wd{font-size:11px;text-align:center;color:var(--muted);padding-bottom:4px}
.day{min-height:64px;border-radius:10px;padding:3px;cursor:pointer;border:0;background:none;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.day:hover{background:var(--fill)}
.day .n{font-size:13px;text-align:center;width:24px;height:24px;line-height:24px;border-radius:50%;margin:0 auto}
.day.today .n{background:var(--accent);color:#fff;font-weight:700}
.day.empty{cursor:default;background:none}
.chip{font-size:10px;border-radius:4px;padding:1px 3px;color:#1c1c1e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;max-width:186px;border:0;background:none;padding:8px 0 10px;color:var(--muted);cursor:pointer;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}
/* sheet */
dialog{border:0;border-radius:20px;padding:0;width:min(520px,calc(100vw - 32px));background:var(--bg);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:12px 8px;border-bottom:1px solid var(--line);background:var(--card)}
.sheet-head b{font-size:16px}
.sheet-body{padding:16px;max-height:70vh;overflow:auto}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
label.f input,label.f select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.swatches button.on{border-color:var(--text)}
.neg{color:var(--danger)}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" aria-label="Tabs">
  <button data-tab="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg>Home</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>
<dialog id="sheet"></dialog>
<script src="app.js"></script>
</body>
</html>
